spring.application.name=ong
# Render (y otros servicios) indican el puerto en la variable PORT
server.port=${PORT:8080}
# Detrás del proxy de Render, la IP real del cliente viene en X-Forwarded-For (la usan los límites de intentos)
server.forward-headers-strategy=native

# --- Base de datos ---
# Por defecto, MySQL local (desarrollo). El driver se deduce de la URL.
# Para Supabase (PostgreSQL) define DB_URL, DB_USER y DB_PASSWORD (ver DESPLIEGUE.md), por ejemplo:
#   DB_URL=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USER=postgres.<id-del-proyecto>
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tfg_ong}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
# Pocas conexiones: el pooler gratuito de Supabase tiene un límite de clientes
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# --- JPA (Hibernate detecta el dialecto solo) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Seguridad JWT ---
# Define la variable de entorno JWT_SECRET (mínimo 32 caracteres) para que las sesiones sobrevivan a un reinicio.
# Si no existe, se genera una clave aleatoria temporal en cada arranque (solo válido para desarrollo).
app.jwt.secret=${JWT_SECRET:}
# Duración del token: 8 horas
app.jwt.expiration-ms=28800000

# --- CORS: dirección(es) del frontend, separadas por comas ---
app.cors.origins=${CORS_ORIGINS:http://localhost:3000}

# --- Administrador inicial ---
# Si la tabla de usuarios está vacía y se definen estas dos variables, se crea un usuario ADMIN al arrancar.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# --- Stripe (suscripciones del plan Pro). Sin estas variables la app funciona, pero no se puede pagar. ---
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Identificadores de los precios creados en Stripe (price_...)
stripe.price-mensual=${STRIPE_PRICE_MENSUAL:}
stripe.price-anual=${STRIPE_PRICE_ANUAL:}
# Dirección del frontend, para volver desde Stripe
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# --- Documentación de la API (Swagger). En producción: SWAGGER_ENABLED=false ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
